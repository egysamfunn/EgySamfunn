<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة التسجيلات — EGYSAMFUNN</title>
<meta name="robots" content="noindex, nofollow" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<style>
  .admin-page { max-width: 1100px; }
  .admin-login {
    background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 40px 32px; max-width: 380px; margin: 60px auto; text-align: center;
  }
  .admin-login input {
    width: 100%; padding: 14px; border: 2px solid var(--line); border-radius: 14px;
    font-family: var(--font-body); font-size: 16px; margin: 16px 0; text-align: center;
  }
  .admin-toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 18px; flex-wrap: wrap; gap: 12px;
  }
  .admin-count { font-family: var(--font-display); font-size: 20px; color: var(--nile-deep); font-weight: 700; }
  .admin-refresh, .admin-export {
    background: var(--nile); color: #fff; border: none; border-radius: 999px;
    padding: 10px 20px; font-family: var(--font-body); font-weight: 700; font-size: 13.5px;
    cursor: pointer;
  }
  .admin-export { background: var(--gold); }
  .admin-error { color: var(--error); font-weight: 700; margin-top: 10px; font-size: 13.5px; }
  .admin-empty {
    text-align: center; padding: 60px 20px; color: var(--ink-soft);
    background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .admin-search {
    width: 100%; padding: 12px 16px; border: 2px solid var(--line); border-radius: 14px;
    font-family: var(--font-body); font-size: 14px; margin-bottom: 18px; background: #fff;
  }

  /* ---------- كروت التسجيل ---------- */
  .reg-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }
  .reg-card {
    background: #fff; border-radius: 20px; box-shadow: var(--shadow);
    overflow: hidden; border: 1px solid var(--line);
  }
  .reg-card__top {
    background: linear-gradient(135deg, var(--nile), var(--nile-deep));
    color: #fff; padding: 16px 18px; display: flex; align-items: center; gap: 12px;
  }
  .reg-card__avatar {
    width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 18px; flex-shrink: 0;
  }
  .reg-card__name { font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.25; }
  .reg-card__name small { display: block; font-family: var(--font-body); font-weight: 600; font-size: 12px; opacity: 0.85; margin-top: 2px; }
  .reg-card__body { padding: 16px 18px; }
  .reg-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px;
  }
  .reg-row:last-child { border-bottom: none; }
  .reg-row__label { color: var(--ink-soft); font-weight: 600; }
  .reg-row__value { font-weight: 700; color: var(--ink); text-align: left; }
  .badge {
    display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
  }
  .badge.member { background: rgba(23,179,163,0.15); color: var(--nile-deep); }
  .badge.nonmember { background: rgba(255,138,61,0.15); color: var(--gold); }
  .reg-card__amount {
    background: var(--sand-deep); margin: 0 -18px -0px; padding: 12px 18px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .reg-card__amount span { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
  .reg-card__amount strong { font-family: var(--font-display); font-size: 20px; color: var(--nile-deep); }
</style>
</head>
<body>

<div class="page admin-page">
  <header class="hero" style="padding: 32px 28px;">
    <p class="hero__eyebrow">EGYSAMFUNN</p>
    <h1 class="hero__title" style="font-size: 26px;">لوحة تسجيلات التجمع</h1>
  </header>

  <div id="loginBox" class="admin-login">
    <p style="font-family: var(--font-display); font-size: 20px; color: var(--nile-deep); margin: 0 0 4px;">تسجيل الدخول</p>
    <p style="color: var(--ink-soft); font-size: 13.5px; margin: 0;">أدخل كلمة المرور لعرض التسجيلات</p>
    <input type="text" id="passwordInput" placeholder="كلمة المرور" autocomplete="off" />
    <button class="submit-btn" id="loginBtn">دخول</button>
    <p class="admin-error" id="loginError" hidden></p>
  </div>

  <div id="dataBox" hidden>
    <div class="admin-toolbar">
      <span class="admin-count" id="regCount"></span>
      <div style="display:flex; gap:10px;">
        <button class="admin-export" id="exportBtn">تصدير CSV</button>
        <button class="admin-refresh" id="refreshBtn">تحديث</button>
      </div>
    </div>
    <input type="text" class="admin-search" id="searchInput" placeholder="ابحث بالاسم أو الإيميل..." />
    <div class="reg-grid" id="regGrid"></div>
  </div>

  <footer class="footer"><p>EGYSAMFUNN — لوحة إدارية داخلية</p></footer>
</div>

<script>
  const loginBox = document.getElementById("loginBox");
  const dataBox = document.getElementById("dataBox");
  const passwordInput = document.getElementById("passwordInput");
  const loginBtn = document.getElementById("loginBtn");
  const loginError = document.getElementById("loginError");
  const regGrid = document.getElementById("regGrid");
  const regCount = document.getElementById("regCount");
  const refreshBtn = document.getElementById("refreshBtn");
  const exportBtn = document.getElementById("exportBtn");
  const searchInput = document.getElementById("searchInput");

  let currentPassword = "";
  let currentData = [];

  async function fetchRegistrations(password) {
    loginError.hidden = true;
    const res = await fetch("/api/admin-registrations", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password })
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "حصل خطأ");
    return body.registrations;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function initials(name) {
    const parts = (name || "").trim().split(/\s+/);
    return (parts[0]?.[0] || "؟") + (parts[1]?.[0] || "");
  }

  function formatAges(childAgesJson) {
    try {
      const ages = JSON.parse(childAgesJson);
      if (!Array.isArray(ages) || !ages.length) return "";
      return ages.join("، ") + " سنة";
    } catch {
      return "";
    }
  }

  function cardHtml(r) {
    const typeLabel = r.registrationType === "family" ? "تسجيل عائلي" : "تسجيل فردي";
    const memberBadge = r.isMember === "yes"
      ? `<span class="badge member">عضو</span>`
      : `<span class="badge nonmember">غير عضو</span>`;
    const dateStr = r.createdAt ? new Date(r.createdAt).toLocaleString("ar-EG", { dateStyle: "medium", timeStyle: "short" }) : "—";

    let rows = `
      <div class="reg-row"><span class="reg-row__label">البريد الإلكتروني</span><span class="reg-row__value">${escapeHtml(r.member1_email)}</span></div>
      <div class="reg-row"><span class="reg-row__label">الهاتف</span><span class="reg-row__value">${escapeHtml(r.member1_phone)}</span></div>
      <div class="reg-row"><span class="reg-row__label">نوع التسجيل</span><span class="reg-row__value">${typeLabel}</span></div>
      <div class="reg-row"><span class="reg-row__label">العضوية</span><span class="reg-row__value">${memberBadge}</span></div>
      <div class="reg-row"><span class="reg-row__label">أطفال تحت 16</span><span class="reg-row__value">${r.hasKidsUnder16 === "yes" ? (r.kidsCount || 0) : "لا"}</span></div>
      ${r.hasKidsUnder16 === "yes" && r.childAges ? `<div class="reg-row"><span class="reg-row__label">أعمار الأطفال</span><span class="reg-row__value">${escapeHtml(formatAges(r.childAges))}</span></div>` : ""}
      <div class="reg-row"><span class="reg-row__label">تاريخ التسجيل</span><span class="reg-row__value">${dateStr}</span></div>
    `;

    if (r.registrationType === "family" && r.member2_name) {
      rows += `
      <div class="reg-row"><span class="reg-row__label">العضو الثاني</span><span class="reg-row__value">${escapeHtml(r.member2_name)}</span></div>
      <div class="reg-row"><span class="reg-row__label">إيميل العضو الثاني</span><span class="reg-row__value">${escapeHtml(r.member2_email)}</span></div>
      `;
    }

    return `
      <div class="reg-card">
        <div class="reg-card__top">
          <div class="reg-card__avatar">${initials(r.member1_name)}</div>
          <div class="reg-card__name">
            ${escapeHtml(r.member1_name)}
            <small>${escapeHtml(r.member1_gender === "male" ? "ذكر" : r.member1_gender === "female" ? "أنثى" : "")}</small>
          </div>
        </div>
        <div class="reg-card__body">
          ${rows}
        </div>
        <div class="reg-card__amount">
          <span>المبلغ المدفوع</span>
          <strong>${r.amountTotal} ${r.currency ? r.currency.toUpperCase() : "kr"}</strong>
        </div>
      </div>
    `;
  }

  function renderCards(data) {
    currentData = data;
    regCount.textContent = `عدد التسجيلات: ${data.length}`;

    if (data.length === 0) {
      regGrid.innerHTML = `<div class="admin-empty" style="grid-column: 1 / -1;">لسه مفيش تسجيلات</div>`;
      return;
    }
    regGrid.innerHTML = data.map(cardHtml).join("");
  }

  function applySearch() {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) { renderCards(currentData); return; }
    const filtered = currentData.filter(r =>
      (r.member1_name || "").toLowerCase().includes(q) ||
      (r.member1_email || "").toLowerCase().includes(q) ||
      (r.member2_name || "").toLowerCase().includes(q)
    );
    renderCards(filtered);
  }

  loginBtn.addEventListener("click", async () => {
    const password = passwordInput.value.trim();
    if (!password) return;
    loginBtn.disabled = true;
    loginBtn.textContent = "جاري التحقق...";
    try {
      const data = await fetchRegistrations(password);
      currentPassword = password;
      loginBox.hidden = true;
      dataBox.hidden = false;
      renderCards(data);
    } catch (err) {
      loginError.textContent = err.message;
      loginError.hidden = false;
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "دخول";
    }
  });

  passwordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") loginBtn.click();
  });

  refreshBtn.addEventListener("click", async () => {
    try {
      const data = await fetchRegistrations(currentPassword);
      searchInput.value = "";
      renderCards(data);
    } catch (err) {
      alert(err.message);
    }
  });

  searchInput.addEventListener("input", applySearch);

  exportBtn.addEventListener("click", () => {
    if (!currentData.length) return;
    const headers = ["التاريخ", "الاسم", "الإيميل", "الهاتف", "النوع", "عضوية", "أطفال", "المبلغ"];
    const rows = currentData.map(r => [
      r.createdAt || "",
      r.member1_name + (r.registrationType === "family" && r.member2_name ? " / " + r.member2_name : ""),
      r.member1_email,
      r.member1_phone,
      r.registrationType === "family" ? "عائلي" : "فردي",
      r.isMember === "yes" ? "عضو" : "غير عضو",
      r.hasKidsUnder16 === "yes" ? (r.kidsCount || 0) : "لا",
      r.amountTotal + " " + (r.currency || "kr")
    ]);
    const csv = "\uFEFF" + [headers, ...rows].map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "تسجيلات-التجمع.csv";
    link.click();
  });
</script>

</body>
</html>
